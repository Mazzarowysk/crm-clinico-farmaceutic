<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Clínico Farmacêutico — Suporte à Decisão &amp; Prescrição Segura (CDSS 4D)</title>
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  
  <!-- Script para limpar Service Workers antigos e Caches do navegador -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <!-- Favicon / Ícone do Sistema -->
  <link rel="icon" type="image/png" href="/assets/crm_logo_v10.png">
  <link rel="apple-touch-icon" href="/assets/crm_logo_v10.png">
  <!-- Fontes Corporativas: Outfit (títulos) e Inter (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Ícones Modernos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js para Gráficos Interativos -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Bibliotecas para Exportação (Relatórios e Laudos) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Google Identity Services SDK para Google Drive API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Estilos Globais e Design System -->
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #080c14;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #0f172a 0%, #080c14 100%);
      gap: 20px;
    }
    .loader-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1.5px solid rgba(20, 184, 166, 0.45);
      border-radius: 24px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(13, 148, 136, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: pulseLogo 3s infinite ease-in-out;
      text-align: center;
      max-width: 90vw;
    }
    .loader-logo-box {
      width: 105px;
      height: 105px;
      border-radius: 22px;
      background: #ffffff;
      border: 2px solid rgba(20, 184, 166, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(13, 148, 136, 0.4);
      flex-shrink: 0;
    }
    .loader-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }
    .loader-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .loader-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
    }
    .loader-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 4px;
    }
    .loader-text {
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: #94a3b8;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Tela de Inicialização / Carregamento com a Logomarca Oficial FarmaLogic -->
    <div class="initial-loader">
      <div class="loader-card">
        <div class="loader-logo-box">
          <img src="/assets/crm_logo_v10.png" alt="FarmaLogic CRM Clínico Farmacêutico" class="loader-logo-img" onerror="this.onerror=null; this.src='/logo.png';">
        </div>
        <div>
          <h1 class="loader-title">CRM Clínico Farmacêutico</h1>
          <span class="loader-badge">Decisão Clínica &bull; CDSS 4D</span>
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">Inicializando módulos e banco de dados...</p>
      </div>
    </div>
  </div>
  <!-- Script de Entrada SPA -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
